<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X17 FN SCAR</title>
</head>

<body>
    <div class="weaponc">
        <div class="cheader">
            <h2>НА РЕМНЕ</h2>
            <h2>></h2>
        </div>
        <div class="cardbody">
            <img class="card" src="x17.jpg" alt="theres an image of a FN SCAR X17">
            <div class="ammo">
                <h1 class="counter">30</h1>
                <h2 class="capacity">/30</h2>
            </div>
            <div class="weapon-info">
                <h3 class="caliber">7.62x51</h3>
                <h3 class="name">X-17</h3>
            </div>
        </div>
        <div class="stats">
            <div class="sitem">
                <span>Эргономика</span>
                <div class="barbg">
                    <div class="barfill ergo"></div>
                </div>
            </div>
            <div class="sitem">
                <span>Отдача</span>
                <div class="barbg">
                    <div class="barfill recoil"></div>
                </div>
            </div>
            <div class="sitem">
                <span>Прицельная дальность</span>
                <div class="barbg">
                    <div class="barfill range"></div>
                </div>
            </div>
        </div>
        <button class="btn">Осмотреть</button>
    </div>
</body>

</html>
